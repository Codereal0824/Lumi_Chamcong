<!doctype html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Đổi mật khẩu | LumiTech</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="../../assets/css/styles.css">
  <link rel="stylesheet" href="../../assets/css/theme.css">
</head>
<body class="bg-slate-50">
  <div class="admin-layout">
    <aside class="sidebar">
      <a href="../../index.html" class="brand-mark"><img class="brand-logo" src="../../assets/images/lumitech-logo.svg" alt="LumiTech Technology"></a>
      <div class="mt-12">
        <p class="nav-label">TỔNG QUAN</p>
        <a class="nav-item" href="dashboard.html">◉ <span>Dashboard</span></a>
        <a class="nav-item" href="timesheet.html">▤ <span>Bảng timesheet</span></a>
        <p class="nav-label mt-10">HỆ THỐNG</p>
        <a class="nav-item" href="team.html">♙ <span>Đội ngũ</span></a>
        <a class="nav-item active" href="change-password.html">🔑 <span>Đổi mật khẩu</span></a>
      </div>
      <div class="sidebar-bottom">
        <div class="avatar">AD</div>
        <div><div class="text-sm font-semibold text-slate-800">Admin</div><div class="text-xs text-slate-500">Quản trị viên</div></div>
        <button class="logout-button sidebar-logout" onclick="logout()" type="button">Đăng xuất</button>
      </div>
    </aside>
    <main class="admin-content">
      <header class="admin-header">
        <div><p class="eyebrow">BẢO MẬT TÀI KHOẢN</p><h1 class="mt-1 text-2xl font-extrabold text-slate-900">Đổi mật khẩu Admin</h1></div>
      </header>
      <section class="form-card max-w-xl">
        <div class="section-title"><span class="section-number">🔒</span><div><h2>Cập nhật mật khẩu</h2><p>Nhập mật khẩu hiện tại và xác nhận mật khẩu mới hai lần.</p></div></div>
        <form id="change-password-form" class="space-y-4">
          <label>Mật khẩu cũ<input name="currentPassword" type="password" required autocomplete="current-password" placeholder="Nhập mật khẩu hiện tại"></label>
          <label>Mật khẩu mới<input name="newPassword" type="password" required minlength="6" autocomplete="new-password" placeholder="Tối thiểu 6 ký tự"></label>
          <label>Nhập lại mật khẩu mới<input name="confirmPassword" type="password" required minlength="6" autocomplete="new-password" placeholder="Nhập lại mật khẩu mới"></label>
          <p id="change-password-message" class="text-sm"></p>
          <button class="btn-primary w-full justify-center" type="submit">Đổi mật khẩu <span>→</span></button>
        </form>
      </section>
    </main>
  </div>
  <script src="../../assets/js/api.js"></script>
  <script src="../../assets/js/change-password.js"></script>
</body>
</html>
