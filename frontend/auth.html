<!doctype html>
<html lang="vi">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Đăng nhập | FieldFlow</title><script src="https://cdn.tailwindcss.com"></script><link rel="stylesheet" href="assets/css/styles.css"><link rel="stylesheet" href="assets/css/auth.css"></head>
<body class="min-h-screen bg-slate-50"><main class="auth-shell"><section class="auth-card"><a href="index.html" class="brand-mark justify-center"><span class="brand-icon">F</span><span>Field<span class="text-teal-600">Flow</span></span></a><div class="mt-8 text-center"><div class="eyebrow">KHU VỰC BẢO MẬT</div><h1 id="auth-title" class="mt-2 text-2xl font-extrabold text-slate-900">Đăng nhập hệ thống</h1><p id="auth-subtitle" class="mt-2 text-sm text-slate-500">Hệ thống tự nhận diện vai trò từ tài khoản của bạn</p></div><div class="auth-tabs"><button id="login-tab" class="active">Đăng nhập</button><button id="register-tab">Đăng ký tài khoản</button></div><form id="login-form" class="mt-6 space-y-4"><label>Tên đăng nhập<input name="username" required autocomplete="username" placeholder="Nhập tên đăng nhập"></label><label>Mật khẩu<input name="password" required type="password" autocomplete="current-password" placeholder="Nhập mật khẩu"></label><button class="btn-primary w-full justify-center" type="submit">Đăng nhập <span>→</span></button><button id="forgot-password" class="text-sm text-teal-700" type="button">Quên mật khẩu?</button></form><form id="register-form" class="mt-6 hidden space-y-4"><label>Họ và tên<input name="fullName" required placeholder="Nguyễn Văn A"></label><label>Tên đăng nhập<input name="username" required minlength="3" placeholder="nguyen.van.a"></label><label>Email<input name="email" type="email" required placeholder="name@example.com"></label><label>Số điện thoại<input name="phone" type="tel" required placeholder="0901234567"></label><label>Chức vụ<select name="position" required><option value="Kỹ thuật viên">Kỹ thuật viên</option><option value="Kế toán">Kế toán</option><option value="Sale">Sale</option><option value="Marketing">Marketing</option></select></label><label>Mật khẩu<input name="password" required minlength="6" type="password" placeholder="Tối thiểu 6 ký tự"></label><label>Xác nhận mật khẩu<input name="confirmPassword" required minlength="6" type="password" placeholder="Nhập lại mật khẩu"></label><button class="btn-primary w-full justify-center" type="submit">Đăng ký tài khoản nhân viên <span>→</span></button></form><section id="reset-panel" class="mt-6 hidden space-y-4"><label>Email hoặc số điện thoại<input id="reset-identifier" required></label><button id="request-otp" class="btn-secondary w-full" type="button">Gửi yêu cầu khôi phục</button><p id="reset-status" class="text-sm text-slate-500">Bạn cần được Admin phê duyệt trước khi nhập OTP.</p><label>Mã xác thực<input id="reset-otp" inputmode="numeric" maxlength="6" disabled></label><label>Mật khẩu mới<input id="reset-password" type="password" minlength="6" disabled></label><label>Xác nhận mật khẩu mới<input id="reset-confirm-password" type="password" minlength="6" disabled></label><button id="reset-submit" class="btn-primary w-full justify-center" type="button" disabled>Đặt lại mật khẩu</button></section><p id="auth-message" class="mt-4 text-center text-sm"></p><p class="mt-6 text-center text-xs text-slate-400">Tài khoản đăng ký luôn là nhân viên. Quyền Admin chỉ do hệ thống quản lý.</p></section></main><script src="assets/js/api.js?v=20261106-3"></script><script src="assets/js/auth.js?v=20261106-3"></script></body></html>
